 if(!v27Obj(st)||!Array.isArray(st.entries)||!Array.isArray(st.closures)||!Array.isArray(st.categories)||!Array.isArray(st.cardPurchases))throw Error('Estructura central de datos inválida');
 if(!v27Obj(st.v9)||!Array.isArray(st.v9.budgets))throw Error('state.v9.budgets debe ser una lista');
 if(!v27Obj(st.v11)||!Array.isArray(st.v11.history)||!Array.isArray(st.v11.future))throw Error('Historial inválido');
 if(!v27Obj(st.v13)||!v27Obj(st.v13.benefits)||!v27Obj(st.v14)||!v27Obj(st.v14.savings))throw Error('Estructura de cuentas o beneficios inválida');
 if(!v27Obj(st.v12)||!Array.isArray(st.v12.groceries)||!Array.isArray(st.v12.services))throw Error('Canastas o servicios inválidos');
 const ids=new Set();
 for(const e of st.entries){if(!v27Obj(e)||typeof e.id!=='string'||!e.id||ids.has(e.id)||!v26ValidDate(e.date)||typeof e.kind!=='string'||!v27Money(e.amount)||e.amount<0)throw Error('Movimiento con ID, fecha o importe inválido');ids.add(e.id)}
 for(const b of st.v9.budgets){if(!v27Obj(b)||typeof b.id!=='string'||!b.id||typeof b.name!=='string'||!v27Month(b.start)||b.end&&!v27Month(b.end)||b.end&&b.end<b.start||!v27Money(Number(b.amount))||Number(b.amount)<0)throw Error('Partida presupuestaria inválida')}
 for(const c of st.closures){if(!v27Obj(c)||!v27Month(c.month)||!v27Money(Number(c.balance)))throw Error('Cierre bancario inválido')}
 for(const p of st.cardPurchases){if(!v27Obj(p)||!p.id||!v26ValidDate(p.date)||!v27Money(Number(p.amount))||Number(p.amount)<0||!Number.isInteger(Number(p.installments))||Number(p.installments)<1)throw Error('Compra CMR inválida')}

 for(const key of ['history','future'])for(const h of st.v11[key]){if(!v27Obj(h)||typeof h.snapshot!=='string'||!h.id)throw Error('Instantánea del historial inválida');try{const x=JSON.parse(h.snapshot);if(!v27Obj(x)||!Array.isArray(x.entries))throw Error('incompatible')}catch(_){throw Error('Instantánea del historial ilegible')}}
 return true;
}

// Vincular automáticamente SOLO si hay una partida inequívoca; las coincidencias dudosas requieren revisión.
function v27RecordUnified(date,category,concept,amount,kind,extra){
 const entry=mk(date,category,concept,amount,kind,extra);
 if(kind==='expense'&&extra.status==='pagado'){
  const month=date.slice(0,7);
  const similar=(a,b)=>{const clean=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/ +/g,' ').trim();let x=clean(a),y=clean(b);return x.length>=4&&y.length>=4&&(x.includes(y)||y.includes(x))};
  const budgets=(S.v9?.budgets||[]).filter(b=>b.active!==false&&b.start<=month&&(!b.end||b.end>=month)&&b.category===category&&(Number(b.amount)===Number(amount)||(Number(b.amount)>Number(amount)&&similar(b.name,concept)))&&!(S.entries||[]).some(e=>e.budgetId===b.id&&String(e.date).slice(0,7)===month&&e.status==='pagado'));
  if(budgets.length===1){entry.budgetId=budgets[0].id;entry.source='v9-real';entry.note=[extra.note,'Pago vinculado a partida '+budgets[0].name].filter(Boolean).join(' · ')}
  else if(budgets.length>1){entry.linkReview=true;entry.note=[extra.note,'Posibles partidas coincidentes: revisar antes de conciliar'].filter(Boolean).join(' · ')}
 }

const MN_SORT={transactions:{field:'date',direction:'desc'},account:{field:'date',direction:'desc'}};
function mnSortRows(rows,section){
 const spec=MN_SORT[section],direction=spec.direction==='asc'?1:-1;
 return rows.map((e,i)=>({e,i})).sort((a,b)=>{
  const av=spec.field==='amount'?Number(a.e.actualAmount||a.e.amount||0):String(a.e.date||'');
  const bv=spec.field==='amount'?Number(b.e.actualAmount||b.e.amount||0):String(b.e.date||'');
  const comparison=av<bv?-1:av>bv?1:0;
  return comparison*direction||a.i-b.i;
 }).map(x=>x.e);
}

MN_DATE.period='month';MN_DATE.month=NOW.slice(0,7);
mnDateMatches=function(e){
 const date=String(e.date||''),month=date.slice(0,7),period=MN_DATE.period;
 if(period==='all')return true;
 if(period==='month')return month===MN_DATE.month;
 if(['last3','last6','last12'].includes(period)){
   const n=Number(period.slice(4));return month>=monthAdd(MN_DATE.month,1-n)&&month<=MN_DATE.month;
 }
 if(period==='range')return (!MN_DATE.from||date>=MN_DATE.from)&&(!MN_DATE.to||date<=MN_DATE.to);
 return month===MN_DATE.month;
};

  /* V28: Cartola first. Running bank balance is separate from the reconciled snapshot.

  function mnBankAccountRow(e){
    if(!e||e.source!=='importación'||e.status!=='pagado'||!['income','expense'].includes(e.kind))return false;
    const a=String(e.account||'').toLowerCase();
    return !/cmr|tarjeta|credito de consumo|crédito de consumo|amipass|junaeb/.test(a);
  }
  function mnBankCutoffRow(snapshot){
    const manual=S.mnBankCutoff;
    if(manual&&manual.date===snapshot.date){const e=S.entries.find(x=>x.id===manual.id&&mnBankAccountRow(x));if(e)return e;}
    // Known operation-level evidence in the supplied November bank statement.
    if(snapshot.date==='2026-11-17'&&snapshot.balance===180237){
      return S.entries.find(e=>mnBankAccountRow(e)&&e.date===snapshot.date&&e.kind==='expense'&&Number(e.amount)===2500&&/OSCHCO SPA/i.test(e.concept||''))||null;
    }
    return null;
  }
  function mnBankOrder(a,b){
    if(a.date!==b.date)return a.date.localeCompare(b.date);
    // The three operations and their exact order are visible in the bank statement.
    if(a.date==='2026-11-17'){
      const order=e=>/OSCHCO SPA/i.test(e.concept||'')?0:/BARRIO NORTE SPA/i.test(e.concept||'')?1:/TUU delManiAlCompleto|TUU DELMANI/i.test(e.concept||'')?2:3;
      let d=order(a)-order(b);if(d)return d;
    }
    // Same-day order is otherwise not proven from timestamps: deterministic display only.
    return (S.entries.indexOf(b)-S.entries.indexOf(a));
  }
  function mnBankRunning(){
    const snapshot=mnReconciledSnapshot(),rows=S.entries.filter(mnBankAccountRow).sort(mnBankOrder),cutoff=mnBankCutoffRow(snapshot);
    const ix=cutoff?rows.findIndex(e=>e.id===cutoff.id):-1;
    let balances=new Map(),definite=new Set(),after=0,balance=snapshot.balance;
    if(ix>=0){
      balances.set(cutoff.id,balance);definite.add(cutoff.id);
      for(let i=ix+1;i<rows.length;i++){const e=rows[i];balance+=(e.kind==='income'?1:-1)*mnActualAmount(e);balances.set(e.id,balance);definite.add(e.id);after++;}
      balance=snapshot.balance-(cutoff.kind==='income'?1:-1)*mnActualAmount(cutoff);
      for(let i=ix-1;i>=0;i--){const e=rows[i];balances.set(e.id,balance);balance-=(e.kind==='income'?1:-1)*mnActualAmount(e);}
    }else{
      let later=rows.filter(e=>e.date>snapshot.date),earlier=rows.filter(e=>e.date<snapshot.date);
      for(let e of later){balance+=(e.kind==='income'?1:-1)*mnActualAmount(e);balances.set(e.id,balance);definite.add(e.id);after++;}
      balance=snapshot.balance;
      for(let e of earlier.reverse()){balance-=(e.kind==='income'?1:-1)*mnActualAmount(e);balances.set(e.id,balance);}
    }
    const last=rows.filter(e=>definite.has(e.id)).at(-1);
    const latest=last?balances.get(last.id):snapshot.balance;
    return {snapshot,balances,definite,cutoff,last,latest,after,unresolved:rows.filter(e=>e.date===snapshot.date&&!cutoff).length,rows};
  }
  function mnBankBalanceCell(e,ledger){
    if(!mnBankAccountRow(e))return '<span class="mn31-notbank" title="No es un cargo o abono importado de cuenta corriente">—</span>';
    if(!ledger.balances.has(e.id))return '<span class="mn31-notbank" title="Aún no se puede posicionar respecto al corte">Sin corte</span>';
    const exact=ledger.definite.has(e.id);
    return '<span class="mn31-bankvalue" title="'+(exact?'Calculado desde el movimiento de corte':'Reconstrucción retrospectiva; verificar orden de operaciones del mismo día')+'">'+fmoney(ledger.balances.get(e.id))+'</span>'+(exact?'':'<small class="mn31-estimate">reconstruido</small>');
  }
  const mn31OldTransactions=transactionsAll;
  transactionsAll=function(){
    let html=mn31OldTransactions(), ledger=mnBankRunning();

      html=html.slice(0,open+7)+(body||'<tr><td colspan="8">No hay movimientos.</td></tr>')+html.slice(close);
    }
    const stamp=ledger.last?.date||ledger.snapshot.date;
    const indicator='<span class="mn32-balance-indicator" title="Estimación a partir del último saldo conciliado y los movimientos posteriores; no es un saldo confirmado por el banco"><span class="mn32-dot"></span><span>Saldo calculado</span><strong>'+fmoney(ledger.latest)+'</strong><small>al '+fd(stamp)+'</small></span>';

    return html;
  };
  const mn31OldAccountTable=v8AccountTable;
  v8AccountTable=function(){
    const html=mn31OldAccountTable(),ledger=mnBankRunning(),source=mnSortRows(mnPeriodRows(true),'account').slice(0,1000);

    updated=updated.replace('<div class="scrollX"><table>','<div class="mn32-countrow">'+badge+'</div><div class="scrollX"><table>');

  const mn31OldRender=render;

    const count=panel.querySelector('.mn30-stat');if(count)count.innerHTML=l.after+' movimiento(s) después del corte<small>Saldo calculado, no confirmado por el banco.</small>';
  };

  window.mn29HomeQA=()=>({month:V.month,anchorDate:S.anchorDate,anchorBalance:S.anchorBalance,displayedCash:mnReconciledSnapshot().balance,calculatedCash:mnSnapshotLedger(mnReconciledSnapshot()).calculated,monthly:nums(V.month),forecast:monthRow(V.month),postAnchor:mnPostAnchorLedger().length});

});

.mn29-balance .mn29-caption{font-size:13px;line-height:1.6;color:#e5ebfa;margin:0;max-width:620px}

.mn29-progress-top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.mn29-progress-top strong{font-size:14px}.mn29-progress-top span{font-size:12px;color:var(--muted)}

<script>
window.mnStorageReady.then(localStorage=>{'use strict';
const KEY='mi-norte-v28-personal-vacia-estado-v1';
// V27 auditoría: espacio aislado, sin migración de claves previas.
const NOW=new Date().toISOString().slice(0,10);const NAMES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];const CATS=['Ingreso','Vivienda','Servicios y aseo','Garantía','Corretaje','CMR','Suscripciones','Personales','Alimentación','Navidad','Moto','Vacaciones','Crédito','Otro'];const NATURES=['Fijo','Variable','Extraordinario'];const ICONS={control:'✦',importer:'↥',calendar:'▦',reconcile:'◎',goals:'◉',dashboard:'◈',monthly:'▦',transactions:'⇅',cmr:'▤',housing:'⌂',plans:'✦',credit:'▥',settings:'⚙',categories:'◫'};

const mk=(date,category,concept,amount,kind='expense',extra={})=>({id:cryptoID(),date,category,concept,amount,kind,status:'previsto',source:'base',...extra});
function cryptoID(){return 'm'+Math.random().toString(36).slice(2,10)}
function defaultNature(e){if(e.nature&&NATURES.includes(e.nature))return e.nature;if(['Navidad','Moto','Vacaciones','Corretaje','Garantía'].includes(e.category))return 'Extraordinario';if(['Personales','Alimentación','Servicios y aseo'].includes(e.category))return 'Variable';return 'Fijo'}
function defaultSub(e){if(e.subcategory)return e.subcategory;if(e.category==='Servicios y aseo')return e.concept.replace(/^Tu mitad: /,'');if(e.category==='Vivienda')return e.concept.includes('comunes')?'Gastos comunes':'Arriendo';if(e.category==='Suscripciones')return e.concept.includes('ChatGPT')?'ChatGPT':'Paramount+';if(e.category==='CMR')return 'Vencimientos';if(e.category==='Personales')return 'Bolsa personal sin desglosar';if(e.category==='Moto')return e.concept.includes('SOAP')?'SOAP':'Permiso de circulación';return e.concept}
const H_SERV=[['electricidad','Electricidad',30000],['agua','Agua',18000],['gas','Gas / agua caliente',20000],['internet','Internet',22000],['aseo','Artículos de aseo',20000]];
function normalizeState(p){
 p.categories=Array.isArray(p.categories)?p.categories:[...CATS];for(const c of CATS)if(!p.categories.includes(c))p.categories.push(c);
 p.entries.forEach(e=>{e.nature=defaultNature(e);e.subcategory=defaultSub(e);if(!e.status)e.status='previsto'});
 p.closures=Array.isArray(p.closures)?p.closures:[];
 p.goals=Array.isArray(p.goals)?p.goals:[];
 p.cardPurchases=Array.isArray(p.cardPurchases)?p.cardPurchases:[];
 p.cardCutoff=19;p.cardDueDay=5;
 if(!p.v3Migration){
   // Los consumos Apple dejan de registrarse como gastos de caja separados.
   p.entries=p.entries.filter(e=>!(e.category==='Suscripciones'&&/ChatGPT|Paramount/i.test(e.concept)));
   // Consumidos el 23 de cada mes: corte 19 siguiente, pago día 5 del subsiguiente.
   // La primera provisión de noviembre se carga al cierre 19/11 (compra 23/10).
   for(let i=0;i<14;i++){let chargeMonth=monthAdd('2026-10',i);let d=chargeMonth+'-23';
     p.cardPurchases.push({id:cryptoID(),date:d,concept:'ChatGPT · Apple',amount:19990,installments:1,category:'Suscripciones',included:false,source:'provisión recurrente',status:'estimado'});
     p.cardPurchases.push({id:cryptoID(),date:d,concept:'Paramount+ · Apple',amount:5690,installments:1,category:'Suscripciones',included:false,source:'provisión recurrente',status:'estimado'});
   }
   p.goals=[{id:cryptoID(),name:'Fondo de emergencia',target:900000,saved:0,deadline:'2027-12',note:'Meta editable. No resta efectivo hasta registrar un aporte.'},{id:cryptoID(),name:'Mudanza y equipamiento',target:300000,saved:0,deadline:'2027-01',note:'Importe orientativo, no gasto cargado hasta registrar una compra.'}];
   p.v3Migration=true;
 }
 p.v4=p.v4||{rules:[],imports:[],alertsDone:{},alertsSnoozed:{},threshold:150000,lastReview:'',ignored:[],confirmedImportIds:[],scheduleSettings:{}};p.version=4;hMigrateState(p);return p;
}
function categoryOptions(selected){return S.categories.map(c=>`<option value="${esc(c)}" ${c===selected?'selected':''}>${esc(c)}</option>`).join('')}
function expenseRows(month){const n=nums(month),es=n.entries.filter(e=>e.kind==='expense').map(e=>({...e,computed:false}));if(n.food>0)es.push({id:'calculated-food',date:month+'-25',category:'Alimentación',subcategory:'Alimentación en efectivo',nature:'Variable',concept:'Alimentación no cubierta por beneficios',amount:n.food,computed:true,kind:'expense'});return es}
function categorySummary(month){const groups=new Map();expenseRows(month).forEach(e=>{const key=e.category+'\u0000'+defaultNature(e);if(!groups.has(key))groups.set(key,{category:e.category,nature:defaultNature(e),amount:0,count:0});const g=groups.get(key);g.amount+=Number(e.amount)||0;g.count++});return [...groups.values()].sort((a,b)=>b.amount-a.amount)}
function natureTotals(month){return NATURES.map(name=>({name,value:sum(expenseRows(month).filter(e=>defaultNature(e)===name))}))}
function renderBreakdown(month,filter='all'){let es=expenseRows(month).filter(e=>filter==='all'||e.nature===filter);let cats=[...new Set(es.map(e=>e.category))].sort();return cats.map(cat=>{let items=es.filter(e=>e.category===cat);const amount=sum(items);return `<details class="groupAccordion" ${cat==='Servicios y aseo'?'open':''}><summary><span><b>${esc(cat)}</b><small>${items.length} partida${items.length!==1?'s':''} · ${esc(filter==='all'?'Fijos, variables y extraordinarios':filter)}</small></span><strong>${fmoney(amount)}</strong></summary><div class="groupInside">${items.map(e=>`<div class="groupItem"><div><b>${esc(e.subcategory||defaultSub(e))}</b><div class="smallText">${esc(e.concept)} · <span class="natureTag">${esc(defaultNature(e))}</span>${e.computed?' · Calculado automáticamente':''}</div></div><div class="row"><strong>${fmoney(e.amount)}</strong>${!e.computed?`<button class="tinyButton" data-action="edit" data-id="${e.id}">Editar</button>${e.kind==='expense'&&e.status==='pagado'&&!e.budgetId?` <button class="tinyButton" type="button" data-v26="linkBudget" data-entry="${e.id}">Vincular presupuesto</button>`:''}`:''}</div></div>`).join('')}</div></details>`}).join('')||'<div class="empty">Sin gastos para este filtro.</div>'}

const mkey=(date)=>String(date||'').slice(0,7);
function monthAdd(key,n){let [y,m]=key.split('-').map(Number);return new Date(y,m-1+n,1).toISOString().slice(0,7)}
function fmoney(v){return (Number(v)<0?'−':'')+'$'+Math.abs(Math.round(Number(v)||0)).toLocaleString('es-CL')}
function fd(v){if(!v)return '';let [y,m,d]=v.split('-');return `${d}/${m}/${y}`}
function labMonth(k){if(!k)return '';let [y,m]=k.split('-').map(Number);return NAMES[m-1]+' '+y}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

// Ciclo CMR: compras 1–19 cierran el 19 del mismo mes; 20+ el 19 del siguiente.
// Pago el 5 del mes siguiente al cierre. Se financia con el sueldo del mes del cierre.
function cardClosing(date){const month=mkey(date);return Number(String(date).slice(8))<=19?month:monthAdd(month,1)}
function cardDue(date,installment=0){return monthAdd(cardClosing(date),1+installment)+'-05'}
function cardBudgetMonth(date,installment=0){return monthAdd(cardClosing(date),installment)}
function cardParts(){return (S.cardPurchases||[]).flatMap(p=>{
 const n=Math.max(1,Math.min(72,Math.round(Number(p.installments)||1)));
 const total=Math.max(0,Number(p.amount)||0),base=Math.floor(total/n),rem=total-base*n;
 const first=/^\d{4}-\d{2}$/.test(String(p.firstBudgetMonth||''))?p.firstBudgetMonth:cardBudgetMonth(p.date);
 const fixed=Number(p.installmentAmount);
 return Array.from({length:n},(_,i)=>{const budget=monthAdd(first,i);
  const amount=Number.isFinite(fixed)&&fixed>0?fixed:base+(i===n-1?rem:0);
  return {purchase:p,part:i+1,total:n,date:monthAdd(budget,1)+'-05',budget,closing:budget,amount};
 });
})}
function cardAutoFor(month){const ps=cardParts().filter(p=>p.budget===month&&!p.purchase.included);const amount=ps.reduce((a,p)=>a+p.amount,0);return amount?{id:'auto-cmr-'+month,date:month+'-25',category:'CMR',subcategory:'Compras y suscripciones nuevas',nature:'Variable',concept:'CMR · cargos adicionales calculados ('+ps.length+')',amount,kind:'expense',status:'previsto',source:'tarjeta-automática',computed:true,note:'Se suman al vencimiento del 5 del mes siguiente. No incluidos en el vencimiento base.'}:null}
function cardInstallmentRows(month){return cardParts().filter(x=>x.budget===month&&!x.purchase.included).map(x=>({
 id:'auto-cmr-'+x.purchase.id+'-'+x.part,date:month+'-25',category:'CMR',
 subcategory:x.purchase.category||'Cuotas CMR',nature:'Variable',
 concept:'CMR · '+x.purchase.concept+' · cuota '+x.part+'/'+x.total,
 amount:x.amount,kind:'expense',status:'previsto',source:'tarjeta-automática',
 cardRef:x.purchase.id,computed:true,
 note:'Cierre '+x.closing+'-19 · vence '+x.date+' · '+(x.purchase.source==='cartola'?'Pendientes según cartola; revisar liquidación.':'Compra registrada')
}))}
function monthEntries(month){const es=entriesFor(month).slice();es.push(...cardInstallmentRows(month));if(S.v8){es.push(...v8VirtualRows(month));v8AddSourceToForecast(month,es)}return es}
function monthClosure(month){return S.closures.find(c=>c.month===month)}
function actualExpense(e){return e.status==='pagado'?(Number.isFinite(Number(e.actualAmount))&&e.actualAmount!==undefined&&e.actualAmount!==''?Number(e.actualAmount):Number(e.amount)):0}
function paidTotals(month){let es=monthEntries(month).filter(e=>e.kind==='expense');let paid=es.filter(e=>e.status==='pagado');return {planned:sum(es),real:paid.reduce((a,e)=>a+actualExpense(e),0),pending:sum(es.filter(e=>e.status!=='pagado')),count:paid.length,total:es.length}}
// V28 PERSONAL EN BLANCO: sin precarga, sin ingresos, gastos, saldos, tarjetas ni objetivos.
function mnBlankState(){
 const d=new Date().toISOString().slice(0,10), month=d.slice(0,7);
 const home=hDefault();
 home.id='mi-vivienda-inicial';home.name='Mi vivienda';home.address='';home.move=month;
 home.rent=0;home.common=0;home.discount=0;home.discountMonths=0;
 home.guaranteeRatio=0;home.guaranteeOverride=0;home.guaranteeMonths=1;home.advanceRentMonths=0;home.advanceRentMonth='';
 home.commissionType='flat';home.commissionRate=0;home.commissionVAT=0;
 home.commissionFlat=0;home.petGuarantee=0;home.extras=[];
 home.services=Object.fromEntries(H_SERV.map(([key])=>[key,0]));
 home.requirements='';
 return {
  version:5,created:d,anchorDate:d,anchorBalance:0,currentMonth:month,view:'dashboard',
  categories:[...CATS],entries:[],closures:[],goals:[],cardPurchases:[],cardCutoff:19,cardDueDay:5,
  credit:{amount:0,rate:0,months:12,start:month,first:monthAdd(month,1),insurance:0,stamp:0},
  housing:{move:month,rent:0,common:0,discount:0,discountMonths:0,guarantee:0,guaranteeMonths:1,commission:0,share:100},
  housingV5:{candidates:[home],active:home.id},notes:[],v3Migration:true,
  v4:{rules:[],imports:[],alertsDone:{},alertsSnoozed:{},threshold:0,lastReview:'',ignored:[],confirmedImportIds:[],scheduleSettings:{}},
  v8:{version:8,view:'projection',account:'all',fund:{name:'Fondo Independencia',mode:'scenario',amount:0,received:'',loanOfferId:'',note:'',allocations:[]},wishlist:[],wishlistSeeded:true,recurrences:[],forecastHousing:false,loanFundGroups:[],lastReviewed:''},

function transactionsAll(){let es=[...S.entries].sort((a,b)=>a.date.localeCompare(b.date));if(V.category!=='all')es=es.filter(e=>e.category===V.category);if(V.status!=='all')es=es.filter(e=>e.status===V.status);if(V.search)es=es.filter(e=>(e.concept+' '+e.category+' '+(e.note||'')).toLowerCase().includes(V.search.toLowerCase()));return top('Movimientos y desglose','Tu registro editable. Cada movimiento alimenta automáticamente todo el dashboard.')+`<div class="card section" style="margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span>Registra aquí y consulta su efecto en Presupuesto, Productos y Actividad.</span><button type="button" class="btn primary" data-v14="register">+ Nuevo movimiento</button></div><div class="card"><div class="filterBar"><div class="field"><label>Buscar</label><input id="query" placeholder="Gasto, tienda, concepto..." value="${esc(V.search)}"></div><div class="field"><label>Categoría</label><select id="catFilter"><option value="all">Todas las categorías</option>${S.categories.map(c=>`<option ${c===V.category?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Estado</label><select id="statusFilter"><option value="all">Todos los estados</option>${['previsto','pagado','pendiente'].map(c=>`<option ${c===V.status?'selected':''}>${c}</option>`).join('')}</select></div></div><div class="note">«Pagado» y «previsto» identifican el estado del movimiento. Los importes siguen formando parte del período correspondiente hasta que los elimines o cambies.</div><div class="scrollX"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Categoría / subcategoría</th><th>Clasificación</th><th>Estado</th><th>Tipo</th><th class="num">Monto</th><th></th></tr></thead><tbody>${es.map(e=>`<tr><td>${fd(e.date)}</td><td><b>${esc(e.concept)}</b>${e.note?`<div class="smallText" title="${esc(e.note)}">${esc(e.note.slice(0,95))}</div>`:''}</td><td>${esc(e.category)}<div class="smallText">${esc(e.subcategory||defaultSub(e))}</div></td><td><span class="natureTag">${esc(defaultNature(e))}</span></td><td><span class="pill ${e.status==='pagado'?'ok':e.status==='pendiente'?'warn':''}">${esc(e.status)}</span></td><td>${(e.kind==='income'?mnAccountLabel(e):({expense:'Gasto',benefit:'Beneficio',benefitNeed:'Alimentación prevista'})[e.kind])}</td><td class="num">${fmoney(e.amount)}</td><td>${e.computed?`<span class="smallText">Automático</span>`:`<button class="tinyButton" data-action="edit" data-id="${e.id}">Editar</button>${e.kind==='expense'&&e.status==='pagado'&&!e.budgetId?` <button class="tinyButton" type="button" data-v26="linkBudget" data-entry="${e.id}">Vincular presupuesto</button>`:''}`}</td></tr>`).join('')}</tbody></table></div>${!es.length?'<div class="empty">No hay movimientos con esos filtros.</div>':''}</div>`}
function cmr(){
 const es=S.entries.filter(e=>e.category==='CMR'&&e.kind==='expense').sort((a,b)=>a.date.localeCompare(b.date));
 const card=S.cardPurchases.slice().sort((a,b)=>a.date.localeCompare(b.date));
 const periods=keys().filter(k=>k>='2026-11'&&k<='2027-12');
 return top('Tarjeta CMR Falabella','Control de compras, cuotas, corte de facturación y vencimientos sin duplicar gastos.')+`
 <div class="banner green"><b>Lógica de facturación configurada:</b> corte el <b>19 de cada mes</b>. Una compra del día 19 entra en ese cierre; desde el <b>20</b> pasa al siguiente. El vencimiento se calcula para el <b>día 5 del mes posterior al cierre</b>. El presupuesto reserva ese pago con el sueldo del mes del cierre.</div>
 <div class="grid metrics section">${kpi('Corte mensual','Día 19','20 en adelante: siguiente estado')}${kpi('Pago mensual','Día 5','Mes posterior al cierre')}${kpi('Compras modeladas',String(card.length),'Incluye suscripciones recurrentes')}${kpi('Cuotas base',fmoney(sum(es)),'Montos históricos estimados')}</div>
 <div class="grid columns section"><div class="card"><div class="sectionHead"><h2>Compras y cuotas</h2><button class="btn primary small" data-action="newCard">+ Compra CMR</button></div>
 <p class="note">Marca «Ya incluida en las cuotas base» cuando la compra esté incorporada en el monto de vencimiento que ingresaste manualmente. Así no se suma nuevamente.</p>
 <div class="scrollX"><table><thead><tr><th>Compra</th><th>Concepto</th><th class="num">Monto</th><th>Cuotas</th><th>Cierre inicial</th><th>Primer vencimiento</th><th>Tratamiento</th><th></th></tr></thead><tbody>${card.map(p=>`<tr><td>${fd(p.date)}</td><td>${esc(p.concept)}</td><td class="num">${fmoney(p.amount)}</td><td>${p.installments}${p.installmentAmount?' · '+fmoney(p.installmentAmount)+'/cuota':''}</td><td>${fd((p.firstBudgetMonth||cardClosing(p.date))+'-19')}</td><td>${fd(monthAdd(p.firstBudgetMonth||cardClosing(p.date),1)+'-05')}</td><td><span class="pill ${p.included?'ok':'warn'}">${p.included?'Incluida':'Adicional'}</span></td><td><button class="tinyButton" data-action="editCard" data-id="${p.id}">Editar</button></td></tr>`).join('')}</tbody></table></div>
 </div><div class="card"><div class="sectionHead"><h2>Próximos pagos</h2><span class="newPill">Base + nuevas compras</span></div><div class="scrollX"><table><thead><tr><th>Mes del sueldo</th><th>Vence</th><th class="num">Base</th><th class="num">Adicional</th><th class="num">Total</th></tr></thead><tbody>${periods.map(m=>{let base=sum(es.filter(e=>mkey(e.date)===m)),extra=cardAutoFor(m)?.amount||0;return base+extra?`<tr><td>${labMonth(m)}</td><td>${fd(monthAdd(m,1)+'-05')}</td><td class="num">${fmoney(base)}</td><td class="num">${fmoney(extra)}</td><td class="num"><b>${fmoney(base+extra)}</b></td></tr>`:''}).join('')}</tbody></table></div><div class="banner amber" style="margin-top:12px">La CMR del <b>5/11/2026</b> ya está pagada. Los vencimientos base provienen de una proyección antigua, por lo que debes actualizar el total cuando se emita cada estado de cuenta.</div></div></div>
 <div class="card section"><div class="sectionHead"><h2>Movimientos originales de cartola CMR</h2><button class="btn small" data-page="importer">Importar cartola</button></div><p class="note">Compras generan cuotas; pagos y devoluciones permanecen identificados por separado y pendientes de conciliación. Ningún pago CMR se registra automáticamente como un segundo gasto.</p><div class="scrollX"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>Tipo</th><th>Estado</th><th class="num">Importe</th></tr></thead><tbody>${(S.v4.imports||[]).filter(r=>r.account==='CMR').slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<tr><td>${fd(r.date)}</td><td>${esc(r.description)}</td><td>${esc(r.cmrType||'revisar')}</td><td>${esc(r.status||'')}</td><td class="num">${fmoney(r.amount)}</td></tr>`).join('')||'<tr><td colspan="5">Todavía no hay cartolas CMR importadas.</td></tr>'}</tbody></table></div></div><div class="card section"><div class="sectionHead"><h2>Detalle de cuotas futuras por compra</h2><span class="pill">Regla del día 19</span></div><div class="scrollX"><table><thead><tr><th>Compra</th><th>Cuota</th><th>Cierre</th><th>Vencimiento</th><th>Mes del presupuesto</th><th class="num">Monto</th></tr></thead><tbody>${cardParts().sort((a,b)=>a.date.localeCompare(b.date)).map(p=>`<tr><td>${esc(p.purchase.concept)}</td><td>${p.part}/${p.total}</td><td>${fd(p.closing+'-19')}</td><td>${fd(p.date)}</td><td>${labMonth(p.budget)}</td><td class="num">${fmoney(p.amount)} ${p.purchase.included?'<span class="pill ok">Incluida</span>':''}</td></tr>`).join('')}</tbody></table></div></div>`+cmrCrossPanel();
}

function cmrCrossPanel(){
 const months=[...new Set(cardParts().filter(x=>!x.purchase.included).map(x=>x.budget))].sort();
 if(!months.length)return `<div class="card section"><h2>Cruce de cuotas entre pestañas</h2><p class="note">Registra una compra o importa la cartola CMR para revisar sus efectos en Presupuesto, Monitoreo y Vencimientos.</p></div>`;
 const rows=months.map(m=>{
  const fromCard=cardParts().filter(x=>x.budget===m&&!x.purchase.included).reduce((a,x)=>a+x.amount,0);
  const fromBudget=monthEntries(m).filter(e=>e.source==='tarjeta-automática').reduce((a,x)=>a+x.amount,0);
  const fromMonitor=mn18BudgetRows(m).filter(e=>e.source==='tarjeta-automática').reduce((a,x)=>a+x.amount,0);
  const due=monthAdd(m,1)+'-05';
  const fromCalendar=v4obligations(monthAdd(m,1)).filter(e=>e.category==='CMR (vencimiento)').reduce((a,x)=>a+x.amount,0);
  return {m,fromCard,fromBudget,fromMonitor,fromCalendar,due,ok:fromCard===fromBudget&&fromCard===fromMonitor&&fromCard===fromCalendar};
 });
 const base=(S.entries||[]).filter(e=>e.category==='CMR'&&e.kind==='expense');
 return `<div class="card section"><div class="sectionHead"><div><h2>Cruce de cuotas entre pestañas</h2><p class="note">Una misma cuota alimenta Tarjeta, Presupuesto, Monitoreo y Vencimientos. No representa pago bancario confirmado.</p></div><span class="pill ${rows.every(x=>x.ok)?'ok':'warn'}">${rows.every(x=>x.ok)?'Cuadra el modelo':'Hay diferencias'}</span></div>
 ${base.length?`<div class="banner amber">Hay ${base.length} partidas manuales base de CMR. Comprueba que no dupliquen compras importadas: el cruce siguiente solo compara las cuotas automáticas.</div>`:''}
 <div class="scrollX"><table><thead><tr><th>Mes presupuestado</th><th class="num">CMR cuotas</th><th class="num">Presupuesto</th><th class="num">Monitoreo</th><th>Vence</th><th class="num">Calendario</th><th>Resultado</th></tr></thead><tbody>${rows.map(r=>`<tr><td><button class="tinyButton" data-cmr-month="${r.m}">${labMonth(r.m)}</button></td><td class="num">${fmoney(r.fromCard)}</td><td class="num">${fmoney(r.fromBudget)}</td><td class="num">${fmoney(r.fromMonitor)}</td><td>${fd(r.due)}</td><td class="num">${fmoney(r.fromCalendar)}</td><td><span class="pill ${r.ok?'ok':'warn'}">${r.ok?'Coincide':'REVISAR'}</span></td></tr>`).join('')}</tbody></table></div><p class="note">Estos importes describen obligaciones previstas. Pagos CMR y devoluciones importadas permanecen por conciliar; para confirmar lo pagado necesitas contrastar la liquidación y el cargo bancario.</p></div>`;
}

// V5: candidatos de vivienda. Solo el escenario activo genera movimientos presupuestarios.

function hDefault(){return {id:cryptoID(),name:'Nueva vivienda',address:'',move:new Date().toISOString().slice(0,7),rent:0,common:0,rentShare:50,commonShare:50,servicesShare:50,commissionShare:50,guaranteeShare:100,discount:0,discountMonths:0,guaranteeRatio:0,guaranteeOverride:0,guaranteeMonths:1,guaranteeStart:'',advanceRentMonths:0,advanceRentMonth:'',commissionType:'flat',commissionRate:0,commissionVAT:0,commissionFlat:0,commissionMonth:'',petGuarantee:0,petShare:100,petMonths:1,extras:[],services:Object.fromEntries(H_SERV.map(([k])=>[k,0])),requirements:''}}
function hNormalize(c){let d=hDefault();let p={...d,...c,services:{...d.services,...(c?.services||{})}};p.extras=Array.isArray(p.extras)?p.extras:[];p.advanceRentMonths=Math.min(12,Math.max(0,Math.round(Number(p.advanceRentMonths)||0)));p.advanceRentMonth=/^\d{4}-\d{2}$/.test(p.advanceRentMonth||'')?p.advanceRentMonth:'';return p}
function hStartDiff(month,start){const [y,m]=month.split('-').map(Number),[a,b]=start.split('-').map(Number);return (y-a)*12+(m-b)}
function hPart(v,p){return Math.round((Number(v)||0)*Math.min(100,Math.max(0,Number(p)||0))/100)}
function hGuarantee(c){return Number(c.guaranteeOverride)>0?Number(c.guaranteeOverride):Math.round(Number(c.rent)*Number(c.guaranteeRatio))}
function hCommission(c){let base=c.commissionType==='flat'?Number(c.commissionFlat):Number(c.rent)*Number(c.commissionRate)/100;return Math.round(base*(1+Number(c.commissionVAT)/100))}
function hExpenses(c,month){let ix=hStartDiff(month,c.move),items=[];
const add=(code,category,concept,amount,nature,day=25,sub=concept)=>{amount=Math.round(Number(amount)||0);if(amount>0)items.push({code,category,concept,amount,nature,subcategory:sub,day})};
const promo=ix<Number(c.discountMonths)?Number(c.discount):0;
const advanceMonths=Math.min(12,Math.max(0,Math.round(Number(c.advanceRentMonths)||0)));
const advancePayMonth=c.advanceRentMonth||c.move;
if(advanceMonths>0&&month===advancePayMonth){let upfront=0;for(let j=0;j<advanceMonths;j++){const reduction=j<Number(c.discountMonths)?Number(c.discount):0;upfront+=hPart(Math.max(0,Number(c.rent)-reduction),c.rentShare);}add('advance-rent','Vivienda','Arriendo anticipado ('+advanceMonths+' mes(es)) · '+c.name,upfront,'Extraordinario',5,'Arriendo por adelantado');}
if(ix>=0){if(ix>=advanceMonths)add('rent','Vivienda','Arriendo · '+c.name,hPart(Math.max(0,c.rent-promo),c.rentShare),'Fijo',5,'Arriendo');
add('common','Vivienda','Gastos comunes · '+c.name,hPart(c.common,c.commonShare),'Fijo',10,'Gastos comunes');
for(let [key,name] of H_SERV)add('svc-'+key,'Servicios y aseo',name+' · '+c.name,hPart(c.services[key],c.servicesShare),'Variable',15,name);}
const gStart=c.guaranteeStart||c.move,gi=hStartDiff(month,gStart),gn=Math.max(1,Number(c.guaranteeMonths)||1),gTotal=hPart(hGuarantee(c),c.guaranteeShare);if(gi>=0&&gi<gn)add('guarantee','Garantía','Garantía '+(gi+1)+'/'+gn+' · '+c.name,Math.floor(gTotal/gn)+(gi===gn-1?gTotal%gn:0),'Extraordinario',5,'Cuota garantía');
if(month===(c.commissionMonth||c.move))add('commission','Corretaje','Comisión de corretaje · '+c.name,hPart(hCommission(c),c.commissionShare),'Extraordinario',5,'Comisión (+ IVA)');
let pn=Math.max(1,Number(c.petMonths)||1),petTotal=hPart(c.petGuarantee,c.petShare);if(ix>=0&&ix<pn&&petTotal>0)add('pet','Garantía','Garantía por mascota '+(ix+1)+'/'+pn+' · '+c.name,Math.floor(petTotal/pn)+(ix===pn-1?petTotal%pn:0),'Extraordinario',5,'Garantía por mascota');
for(let e of c.extras||[]){const st=e.start||c.move,ei=hStartDiff(month,st),en=Math.max(1,Number(e.months)||1),share=hPart(e.amount,e.share??100);if(ei>=0&&ei<en)add('extra-'+e.id,e.category||'Vivienda',e.name+' '+(en>1?`${ei+1}/${en}`:'')+' · '+c.name,Math.floor(share/en)+(ei===en-1?share%en:0),'Extraordinario',Number(e.day)||5,e.name)}
return items}
function hSync(S){if(!S.housingV5)return;let c=S.housingV5.candidates.find(x=>x.id===S.housingV5.active);if(!c)return;let prev=new Map(S.entries.filter(e=>e.source==='housing-v5').map(e=>[e.id,e]));S.entries=S.entries.filter(e=>e.source!=='housing-v5');const start=Number(c.advanceRentMonths)>0&&c.advanceRentMonth&&c.advanceRentMonth<'2026-11'?c.advanceRentMonth:'2026-11';for(let i=0;i<48;i++){let month=monthAdd(start,i);if(month>'2030-12')break;for(let h of hExpenses(c,month)){let date=month+'-'+String(h.day).padStart(2,'0'),id='housing-v5-'+month+'-'+h.code,old=prev.get(id);S.entries.push({id,date,amount:h.amount,concept:h.concept,category:h.category,subcategory:h.subcategory,nature:h.nature,kind:'expense',status:old?.status||'previsto',actualAmount:old&&old.amount===h.amount?old.actualAmount:'',due:date,note:'Generado por escenario «'+c.name+'». Modifica la partida desde Independencia para mantener todas las pestañas sincronizadas.',source:'housing-v5',housingCode:h.code})}}}
function hMigrateState(S){if(!S.housingV5){let c=hDefault(),legacy=S.housing||{};c.move=legacy.move||c.move;c.rent=Number(legacy.rent)||c.rent;c.common=Number(legacy.common)||c.common;c.discount=Number(legacy.discount??c.discount);c.discountMonths=Number(legacy.discountMonths??c.discountMonths);c.guaranteeOverride=Number(legacy.guarantee)||0;c.guaranteeMonths=Number(legacy.guaranteeMonths)||6;c.rentShare=Number(legacy.share??50);c.commonShare=c.rentShare;c.servicesShare=c.rentShare;c.commissionShare=c.rentShare;
// Preservar por separado los cambios que se hayan hecho en los servicios del escenario base.
const old=S.entries.filter(e=>e.source==='base'&&e.kind==='expense'&&e.date.startsWith('2027-07'));
for(let [key,name] of H_SERV){let match=old.find(e=>e.category==='Servicios y aseo'&&((e.subcategory||'').toLowerCase().includes(name.toLowerCase().slice(0,5))||e.concept.toLowerCase().includes(name.toLowerCase().slice(0,5))));if(match)c.services[key]=Math.round(Number(match.amount)*2)}
S.housingV5={candidates:[c],active:c.id};
// Retirar solo las partidas de vivienda preexistentes «base». Mantener compras y gastos manuales.
S.entries=S.entries.filter(e=>!(e.source==='base'&&e.kind==='expense'&&['Vivienda','Servicios y aseo','Garantía','Corretaje'].includes(e.category)&&e.date>='2027-01'));
}else{S.housingV5.candidates=S.housingV5.candidates.map(hNormalize);if(!S.housingV5.candidates.some(c=>c.id===S.housingV5.active))S.housingV5.active=S.housingV5.candidates[0]?.id}
hSync(S);S.version=5}
function hCandidate(){return S.housingV5.candidates.find(x=>x.id===(V.hCandidate||S.housingV5.active))||S.housingV5.candidates[0]}
function hSelected(c,key){return Number(c[key])}
function hInput(label,key,v,opts={}){return `<div class="field"><label>${esc(label)}</label><input type="${opts.type||'number'}" name="${key}" value="${esc(v)}" ${opts.type==='text'?'':opts.type==='month'?'':`min="${opts.min??0}" step="${opts.step||1}"`} ${opts.placeholder?`placeholder="${esc(opts.placeholder)}"`:''}></div>`}
function hNumberField(c,label,key){return hInput(label,key,c[key])}

function mnHousingSafeUrl(v){const t=String(v||'').trim().replace(/[),.;]+$/,'');try{const u=new URL(t);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function mnHousingUrl(c){const own=mnHousingSafeUrl(c.listingUrl);if(own)return own;const m=String(c.requirements||'').match(/https?:\/\/[^\s<>"']+/i);return m?mnHousingSafeUrl(m[0]):''}
function mnHousingParse(txt){const lines=String(txt||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean), raw=lines.join('\n');
 const urls=raw.match(/https?:\/\/[^\s<>"']+/gi)||[];
 const price=s=>{const m=String(s).match(/(?:\$|CLP\s*)?\s*(\d{1,3}(?:[. ]\d{3})+|\d{4,7})(?!\d)/i);return m?Number(m[1].replace(/[. ]/g,'')):null};
 const matchLine=(patterns,ban)=>{for(const line of lines){if(patterns.some(p=>p.test(line))&&(!ban||!ban.test(line))){const n=price(line.replace(/\b(?:20\d\d|2027)\b/g,''));if(n!==null)return n}}return null};
 const common=matchLine([/gastos?\s+comunes?/i,/\bgg\s*cc\b/i,/\bg\.?c\.?\b/i]);
 const rent=matchLine([/\barriendo\b/i,/\brenta\s+mensual\b/i,/\bcanon\b/i],/\b(?:arriendo\s*\+|total\s*con|incluye\s*(?:gastos|gc)|arriendo\s+y\s+(?:gc|gastos))\b/i);
 const addressLine=lines.find(l=>/^(?:direcci[oó]n|ubicaci[oó]n|sector|domicilio)\s*[:\-]/i.test(l));
 const address=addressLine?addressLine.replace(/^[^:\-]+[:\-]\s*/,'').slice(0,160):'';
 const title=lines.find(l=>!/^https?:/i.test(l)&&!/(?:gastos?\s+comunes?|\bggcc\b|^arriendo\s*[:\-]|^renta\s*mensual\s*[:\-])/i.test(l)&&!/^\$?[\d.]+\s*(?:CLP|UF)?$/i.test(l))||'';
 return {name:title.slice(0,110),address,rent,common,url:urls.map(mnHousingSafeUrl).find(Boolean)||'',raw};
}

}

function hCompanion(c,month){let t=0,ix=hStartDiff(month,c.move);let advanceMonths=Math.min(12,Math.max(0,Math.round(Number(c.advanceRentMonths)||0))),advancePayMonth=c.advanceRentMonth||c.move;
if(month===advancePayMonth&&advanceMonths>0){for(let j=0;j<advanceMonths;j++){let pr=j<Number(c.discountMonths)?Number(c.discount):0,net=Math.max(0,Number(c.rent)-pr);t+=net-hPart(net,c.rentShare);}}
if(ix<0)return Math.round(t);
let promo=ix<Number(c.discountMonths)?Number(c.discount):0;if(ix>=advanceMonths)t+=Math.max(0,c.rent-promo)-hPart(Math.max(0,c.rent-promo),c.rentShare);t+=Number(c.common)-hPart(c.common,c.commonShare);for(let [key] of H_SERV)t+=Number(c.services[key])-hPart(c.services[key],c.servicesShare);let g=hGuarantee(c),gn=Math.max(1,Number(c.guaranteeMonths)||1),gi=hStartDiff(month,c.guaranteeStart||c.move),share=g-hPart(g,c.guaranteeShare);if(gi>=0&&gi<gn)t+=Math.floor(share/gn)+(gi===gn-1?share%gn:0);if(month===(c.commissionMonth||c.move))t+=hCommission(c)-hPart(hCommission(c),c.commissionShare);let pn=Math.max(1,Number(c.petMonths)||1),pet=Number(c.petGuarantee)-hPart(c.petGuarantee,c.petShare);if(ix<pn)t+=Math.floor(pet/pn)+(ix===pn-1?pet%pn:0);for(let e of c.extras||[]){let start=e.start||c.move,d=hStartDiff(month,start),count=Math.max(1,Number(e.months)||1);if(d>=0&&d<count){let other=Number(e.amount)-hPart(e.amount,e.share??100);t+=Math.floor(other/count)+(d===count-1?other%count:0)}}return Math.round(t)}

function loanReady(){if(!Array.isArray(S.loanOffers))S.loanOffers=[];if(!S.loanRates)S.loanRates=[];if(!S.loanDraft){const c=S.credit||{};S.loanDraft={id:'',name:'Banco Falabella · oferta 12 cuotas',mode:'official',product:'Súper Avance CMR',amount:1500000,rate:3.42,months:12,disbursement:'2026-12-15',firstDue:'2027-03-05',fee:12000,insurance:0,monthly:173010,cae:43.78,ctc:2088128,rateSource:'Captura de simulación Banco Falabella; fecha de desembolso y primera cuota por confirmar',rateDate:NOW,notes:'Primera cuota y desembolso son FECHAS ILUSTRATIVAS: el banco informó 3 meses, no día exacto. Corrígelas antes de incorporar.'}}return S.loanDraft}
function addMonthsDate(date,n){let [y,m,d]=String(date||'2027-01-05').split('-').map(Number);let out=new Date(y,m-1+n,1);let last=new Date(out.getFullYear(),out.getMonth()+1,0).getDate();return `${out.getFullYear()}-${String(out.getMonth()+1).padStart(2,'0')}-${String(Math.min(d,last)).padStart(2,'0')}`}
function monthsBetweenDates(a,b){const aa=new Date(a+'T12:00:00'),bb=new Date(b+'T12:00:00');return Math.max(0,(bb-aa)/86400000/30.4375)}
function loanCalc(c){const p=Math.max(0,Number(c.amount)||0),n=Math.max(1,Math.round(Number(c.months)||1)),r=Math.max(0,Number(c.rate)||0)/100;const disb=String(c.disbursement||'2026-12-25'),first=String(c.firstDue||'2027-02-05');const delay=Math.max(0,monthsBetweenDates(disb,first)-1),factor=Math.pow(1+r,delay),dueCap=p*factor;const theoretical=r===0?p/n:dueCap*r/(1-Math.pow(1+r,-n));const official=c.mode==='official'&&Number(c.monthly)>0;const payment=official?Number(c.monthly):theoretical;const installmentTotal=payment*n;const fee=Math.max(0,Number(c.fee)||0),insurance=Math.max(0,Number(c.insurance)||0);const derived=installmentTotal+fee+insurance;const ctc=official&&Number(c.ctc)>0?Number(c.ctc):derived;const last=addMonthsDate(first,n-1);return {p,n,r,delay,factor,theoretical,payment,installmentTotal,fee,insurance,ctc,interest:installmentTotal-p,last,first,disb,official,derived,difference:ctc-derived}}

function loanDifference(c){let cc=loanCalc(c),base=forecasts().filter(x=>x.key>=mkey(c.disbursement)&&x.key<=mkey(cc.last));return base.map(row=>{let count=0;for(let i=0;i<cc.n;i++)if(mkey(addMonthsDate(cc.first,i))===row.key)count++;const loan=(mkey(cc.disb)===row.key?cc.p:0)-(count*cc.payment)-(mkey(cc.disb)===row.key?cc.fee+cc.insurance:0);return {month:row.key,base:row.delta,change:loan,total:row.delta+loan}})}

 if(dups.length){
  const examples=dups.slice(0,5).map(d=>`${d.row.date} · ${d.row.description} · ${fmoney(d.row.amount)} (${d.reason})`).join('\n');
  if(!confirm(`Has seleccionado ${dups.length} movimiento(s) señalados como posibles duplicados.\n\n${examples}${dups.length>5?'\n… y '+(dups.length-5)+' más':''}\n\n¿Confirmas expresamente que son movimientos reales distintos y quieres agregarlos? Esto puede generar cargos/abonos adicionales si los registros ya existían.`))return;
 }
 // Las coincidencias son advertencias: solo el usuario decide si agrega una fila válida.

 const decisions=[];
 for(const r of proposed){

  const cardPurchases=r.amount<0&&r.account==='CMR'?(S.cardPurchases||[]).filter(x=>x.date===r.date&&Number(x.amount)===n&&v4norm(x.concept)===v4norm(concept)):[];
  if(candidates.length>1||linkedGroceries.length>1||cardPurchases.length>1)return notify('Coincidencias ambiguas en la cartola: '+concept+'. Revisa los registros antes de contabilizar; no se importó nada.');
  decisions.push({r,candidate:candidates[0],incomeReview,groceryReview,grocery:linkedGroceries[0],card:cardPurchases[0]});
 }
 if(!confirm(`Confirmar ${decisions.length} movimientos revisados. Las transferencias y pagos vinculados no se contarán nuevamente como gasto.`))return;
 const old=JSON.stringify(S);
 let included=0,linked=0,review=0;

 I.rows=[];I.cols=[];I.matrix=[];render();notify(`Cartola guardada: ${included} registros nuevos, ${linked} coincidencias vinculadas y ${review} pendientes de revisión.`)

function budgetVsActual(){const month=V.compareMonth||'2027-01';const groups={};for(const e of expenseRows(month)){const k=e.category;if(!groups[k])groups[k]={budget:0,paid:0,count:0};groups[k].budget+=Number(e.amount||0);if(e.status==='pagado')groups[k].paid+=actualExpense(e);groups[k].count++}const lines=Object.entries(groups).sort((a,b)=>b[1].budget-a[1].budget);return `<div class="card section"><div class="sectionHead"><div><h2>Presupuesto vs. gasto real por categoría</h2><p class="subtle">Marcando «pagado» y el importe real en cada movimiento podrás comparar tus desviaciones.</p></div><select class="control" id="compareMonth" style="width:auto">${keys().filter(m=>m>='2026-11'&&m<='2027-12').map(m=>`<option value="${m}" ${m===month?'selected':''}>${labMonth(m)}</option>`).join('')}</select></div><div class="scrollX"><table><thead><tr><th>Categoría</th><th class="num">Presupuestado</th><th class="num">Real pagado</th><th class="num">Pendiente de registrar</th></tr></thead><tbody>${lines.map(([cat,v])=>`<tr><td>${esc(cat)}</td><td class="num">${fmoney(v.budget)}</td><td class="num">${fmoney(v.paid)}</td><td class="num">${fmoney(Math.max(0,v.budget-v.paid))}</td></tr>`).join('')}</tbody></table></div><p class="note">La diferencia no es necesariamente ahorro: parte puede corresponder a pagos aún pendientes. Alimentación cubierta por beneficios no representa salida de efectivo.</p></div>`}

}

function v8FundCoverage(month){const f=v8Fund();if(f.mode!=='active')return 0;return f.allocations.filter(a=>a.state==='paid'&&a.month===month&&a.coverPersonal===true).reduce((x,a)=>x+Number(a.amount||0),0)}
function v8FundCoveredEntries(month){const f=v8Fund();if(f.mode!=='active')return 0;const covered={};for(const a of f.allocations){if(a.state!=='paid'||!a.ref||a.month!==month||a.wishId)continue;const e=S.entries.find(e=>e.id===a.ref&&e.kind==='expense'&&mkey(e.date)===month&&e.status!=='pagado');if(!e)continue;covered[e.id]=(covered[e.id]||0)+Number(a.amount||0)}const matched=Object.entries(covered).reduce((t,[id,n])=>t+Math.min(Math.max(0,Number(S.entries.find(e=>e.id===id)?.amount)||0),n),0);const old=f.allocations.filter(a=>a.state==='paid'&&a.coverPersonal===true&&!a.ref&&!a.wishId&&a.month===month).reduce((t,a)=>t+Number(a.amount||0),0);const allHousing=S.entries.filter(e=>e.kind==='expense'&&e.source==='housing-v5'&&mkey(e.date)===month&&e.status!=='pagado');return matched+Math.min(old,Math.max(0,sum(allHousing)-matched))}

function v8WishlistImpact(month){v8Init();const out=[];for(let w of S.v8.wishlist){if(w.status!=='scenario')continue;const cost=Number(w.price)||0;if(cost<=0)continue;if(w.method==='debit'&&w.month===month)out.push({id:'wish-'+w.id,date:month+'-20',category:w.category||'Compras',subcategory:'Wishlist',concept:'Simulación compra: '+w.name,amount:cost,kind:'expense',nature:'Variable',computed:true,status:'previsto',source:'v8-wishlist'});else if(w.method==='cmr'){let n=Math.max(1,Number(w.installments)||1);let due=cardBudgetMonth((w.month||'2027-01')+'-'+String(w.day||20).padStart(2,'0'));let ix=hStartDiff(month,due);if(ix>=0&&ix<n)out.push({id:'wish-'+w.id+'-'+ix,date:month+'-25',category:'CMR',subcategory:'Wishlist en cuotas',concept:'Simulación CMR: '+w.name+' '+(ix+1)+'/'+n,amount:Math.floor(cost/n)+(ix===n-1?cost%n:0),kind:'expense',nature:'Variable',computed:true,status:'previsto',source:'v8-wishlist'});}}

td class="num">${fmoney(r.total)}</td><td class="num ${r.delta<0?'negative':'positive'}">${fmoney(r.delta)}</td><td class="num"><b>${fmoney(r.balance)}</b></td></tr>`).join('')}</tbody></table></div></div><div class="banner amber section">El saldo real se obtiene de la conciliación bancaria. Los importes planificados o financiados no son pagos confirmados. La caja del crédito es un control virtual distinto de tu cuenta corriente.</div>`}

function mnFundStats(){const f=v8Fund(),a=f.allocations||[],n=x=>a.filter(q=>q.state===x).reduce((t,q)=>t+(Number(q.amount)||0),0),wishlistMissing=mnWishFundUnallocatedScenario().reduce((t,w)=>t+Number(w.price||0),0);const used=n('paid'),reserved=n('reserved'),planned=n('planned')+wishlistMissing,total=Math.max(0,Number(f.amount)||0);return {total,used,reserved,planned,free:total-used-reserved,simulatedFree:total-used-reserved-planned,wishPaid:a.filter(q=>q.wishId&&q.state==='paid').reduce((t,q)=>t+Number(q.amount||0),0)};}
function mnFundAlreadyCovered(ref,exclude=''){return v8Fund().allocations.filter(a=>a.id!==exclude&&a.ref===ref&&a.state!=='cancelled').reduce((t,a)=>t+Number(a.amount||0),0)}
function mnFundIssue(a,exclude=''){
 if(!a.name||!/^\d{4}-\d{2}$/.test(a.month)||!Number.isSafeInteger(a.amount)||a.amount<=0)return 'Completa concepto, mes e importe entero mayor que cero.';
 const found=a.ref?S.entries.find(e=>e.id===a.ref):null;
 if(a.ref&&(!found||found.kind!=='expense'||mkey(found.date)!==a.month))return 'La obligación vinculada ya no existe en el mes seleccionado. Selecciona otra.';
 if(found&&a.amount+mnFundAlreadyCovered(a.ref,exclude)>Number(found.amount))return 'Las asignaciones superan el monto de la obligación. Reduce el importe.';
 if(['reserved','paid'].includes(a.state)){const other=v8Fund().allocations.filter(x=>x.id!==exclude&&['reserved','paid'].includes(x.state)).reduce((t,x)=>t+Number(x.amount||0),0);if(other+a.amount>Number(v8Fund().amount||0))return 'Saldo insuficiente: no se puede reservar ni pagar más que el capital disponible.';}
 if(a.state==='paid'&&v8Fund().mode!=='active')return 'No puedes confirmar un pago mientras el fondo es una simulación.';
 if(a.state==='paid'&&found?.status==='pagado')return 'Esta obligación ya figura pagada en movimientos. Revisa la conciliación para evitar duplicarla.';
 return '';
}

// V28 Wishlist ↔ Fondo: one purchase, one funding allocation, two synchronized views.
function mnWishFundAllocation(id){return v8Fund().allocations.find(a=>a.wishId===id&&a.state!=='cancelled')||null}
function mnWishFundDuplicate(id){return v8Fund().allocations.filter(a=>a.wishId===id&&a.state!=='cancelled').length>1}
function mnWishFundUnallocatedScenario(){return S.v8.wishlist.filter(w=>w.method==='fund'&&w.status==='scenario'&&!mnWishFundAllocation(w.id));}
function mnWishFundCommittedOther(id){return v8Fund().allocations.filter(a=>a.wishId!==id&&['reserved','paid'].includes(a.state)).reduce((sum,a)=>sum+Number(a.amount||0),0)}
function mnWishFundPlan(w,state){
 if(!w||w.method!=='fund'||w.status==='bought')return 'Este artículo no está disponible para financiación con el fondo.';
 const amount=Number(w.price);
 if(!Number.isSafeInteger(amount)||amount<=0)return 'Indica un precio positivo antes de simular o reservar.';
 if(mnWishFundDuplicate(w.id))return 'Hay asignaciones duplicadas de este artículo; revisa el respaldo antes de modificarlo.';
 const existing=mnWishFundAllocation(w.id),fund=v8Fund();
 if(existing?.state==='paid')return 'La compra ya está confirmada.';
 if(state==='reserved'&&mnWishFundCommittedOther(w.id)+amount>Number(fund.amount||0))return 'No hay saldo libre suficiente para reservar este artículo.';
 if(state==='planned'&&existing?.state==='reserved')return 'Primero libera la reserva; no se modificará sin confirmación.';
 if(existing)Object.assign(existing,{name:w.name,amount,month:w.month,state,source:'wishlist-fund',coverPersonal:false});
 else fund.allocations.push({id:cryptoID(),wishId:w.id,name:w.name,amount,month:w.month,state,source:'wishlist-fund',coverPersonal:false});
 w.status='scenario';return '';
}
function mnWishFundRelease(w){
 const a=mnWishFundAllocation(w.id);
 if(a?.state==='paid'||w.status==='bought')return notify('Una compra confirmada no puede liberarse como simulación.');
 if(a?.state==='reserved'&&!confirm('¿Liberar la reserva de '+fmoney(a.amount)+' para «'+w.name+'»? No se registra ningún pago.'))return;
 v8Fund().allocations=v8Fund().allocations.filter(x=>x.wishId!==w.id);
 w.status='wish';save();render();notify('Simulación liberada. Fondo y Wishlist actualizados.');
}
function mnWishFundSimulate(w){
 if(w.status==='bought')return notify('La compra ya está confirmada.');
 const a=mnWishFundAllocation(w.id);
 if(a||w.status==='scenario')return mnWishFundRelease(w);
 const error=mnWishFundPlan(w,'planned');if(error)return notify(error);
 save();render();notify('Artículo simulado en Wishlist y Fondo Independencia.');
}
function mnWishFundReserve(w){
 const error=mnWishFundPlan(w,'reserved');if(error)return notify(error);
 save();render();notify('Reserva registrada una vez en Fondo Independencia; todavía no es un pago.');
}
function mnWishFundConfirm(w){
 if(!w||w.status==='bought')return notify('Esta compra ya fue confirmada.');
 if(w.method!=='fund')return notify('Selecciona Fondo Independencia como origen de pago.');
 if(mnWishFundDuplicate(w.id))return notify('Se detectaron asignaciones duplicadas. No se confirmará otro pago.');
 const amount=Number(w.price),f=v8Fund(),a=mnWishFundAllocation(w.id);
 if(!Number.isSafeInteger(amount)||amount<=0)return notify('Indica un precio válido antes de confirmar.');
 if(f.mode!=='active')return notify('El fondo está en solo simulación. Actívalo únicamente si el capital realmente está disponible.');
 if(mnWishFundCommittedOther(w.id)+amount>Number(f.amount||0))return notify('Saldo libre insuficiente; no se realizó ningún pago.');
 if(!confirm('¿Confirmas que compraste «'+w.name+'» por '+fmoney(amount)+' usando Fondo Independencia? Se descontará una sola vez del fondo y no se creará un cargo bancario adicional.'))return;
 if(a)Object.assign(a,{name:w.name,amount,month:w.month,state:'paid',paidAt:NOW,source:'wishlist-fund',coverPersonal:false});
 else f.allocations.push({id:cryptoID(),wishId:w.id,name:w.name,amount,month:w.month,state:'paid',paidAt:NOW,source:'wishlist-fund',coverPersonal:false});
 w.status='bought';MN15Wish.editing=null;save();render();notify('Compra confirmada una sola vez. Visible en Wishlist y Fondo Independencia.');
}
function mnWishFundUpdate(existing,next){
 if(existing&&mnWishFundDuplicate(existing.id))return 'Existen asignaciones duplicadas de este artículo; revisa antes de editar.';
 const alloc=existing&&mnWishFundAllocation(existing.id);
 if(existing?.status==='bought')return 'Una compra ya confirmada no se edita desde Wishlist.';
 if(alloc?.state==='reserved'&&(next.method!=='fund'||Number(next.price)!==Number(alloc.amount)||next.month!==alloc.month))return 'Este artículo tiene una reserva. Libérala desde el Fondo antes de modificar el importe, el mes o el medio de pago.';
 if(next.method!=='fund'){
  v8Fund().allocations=v8Fund().allocations.filter(a=>a.wishId!==next.id);
  return '';
 }
 if(alloc){Object.assign(alloc,{name:next.name,amount:Number(next.price),month:next.month});}
 return '';
}

function v10Init(){
  v9Init();v8Init();
  if(!S.v10)S.v10={version:10,items:[],loanShare:100,showHelp:true};
  S.v10.items??=[];S.v10.loanShare??=100;

// El comparador está en Inicio; desde los planes se abre por el acceso persistente.
function v10Months(){return [...new Set([...keys(),'2027-01','2027-03','2027-07','2027-12','2028-06','2028-12'])].filter(x=>x>='2026-11'&&x<='2028-12').sort();}
function v10N(v){return Math.max(0,Number(v)||0)}
function v10CountMonths(a,b){return (+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7))}
function v10Currency(v){return (v<0?'−':'')+fmoney(Math.abs(Math.round(v)))}
function v10LoanDue(offer,month){if(!offer)return 0;let c=loanCalc(offer);let ix=v10CountMonths(mkey(c.first),month);return ix>=0&&ix<c.n?Math.round(c.payment):0;}
// Corrección confirmada en auditoría: simular o recibir el capital no lo convierte en sueldo.
loanDifference=function(offer){let cc=loanCalc(offer);return forecasts().filter(x=>x.key>=mkey(cc.disb)&&x.key<=mkey(cc.last)).map(x=>{let pay=v10LoanDue(offer,x.key),fee=x.key===mkey(cc.disb)?cc.fee+cc.insurance:0;return {month:x.key,base:x.delta,change:-(pay+fee),total:x.delta-pay-fee,loanPrincipal:cc.p,debtRemaining:'Deuda, no saldo personal'}})};
// Sólo un préstamo realmente activo se carga al presupuesto base. Simular no es contratar.
v8LoanPersonal=function(month){const f=v8Fund();if(f.mode!=='active'||!f.loanOfferId)return 0;let o=(S.loanOffers||[]).find(x=>x.id===f.loanOfferId);if(!o)return 0;const share=Math.max(0,Math.min(100,Number(f.personalShare??100)))/100;return Math.round(v10LoanDue(o,month)*share)};
// Planear o reservar no equivale a haber pagado el gasto desde el fondo.
v8FundCoverage=function(month){const f=v8Fund();if(f.mode!=='active')return 0;return f.allocations.filter(a=>a.state==='paid'&&a.month===month&&a.coverPersonal===true).reduce((x,a)=>x+v10N(a.amount),0)};
// Evitamos la incorporación doble de préstamos confirmados al simular la MISMA oferta.
function v10Selected(){return S.v10.items.filter(x=>x.enabled!==false)}
function v10Events(){const ev=[];const act=v10Selected();const activeFund=v8Fund();
 for(const x of act){
   if(x.type==='wish'){
     let w=S.v8.wishlist.find(o=>o.id===x.ref);if(!w||w.status==='bought'||!(Number(w.price)>0))continue;
     const p=v10N(w.price),m=w.month||'2027-01';
     if(w.method==='debit')ev.push({id:x.id,name:w.name,month:m,personal:p,source:'Wishlist · débito'});
     else if(w.method==='fund')ev.push({id:x.id,name:w.name,month:m,fund:p,source:'Wishlist · fondo'});
     else if(w.method==='cmr'){const n=Math.max(1,Number(w.installments)||1),start=cardBudgetMonth(m+'-'+String(w.day||20).padStart(2,'0'));for(let i=0;i<n;i++)ev.push({id:x.id,name:w.name+' · '+(i+1)+'/'+n,month:monthAdd(start,i),personal:Math.floor(p/n)+(i===n-1?p%n:0),source:'Wishlist · CMR'});}

     let o=(S.loanOffers||[]).find(o=>o.id===x.ref);if(!o||activeFund.mode==='active'&&activeFund.loanOfferId===o.id)continue;

function mn11Integrity(){const issues=[];let sets=new Map(),dup=0;
 for(const e of S.entries){if(!e.date||!Number.isFinite(Number(e.amount)))issues.push({level:'urgent',text:'Movimiento con fecha o monto inválido',detail:e.concept||e.id});if(e.source==='housing-v5'||e.kind==='benefit'||e.kind==='benefitNeed')continue;const k=[e.date,e.kind,Math.round(e.amount),String(e.concept||'').toUpperCase().trim()].join('|');if(sets.has(k))dup++;sets.set(k,1)}
 if(dup)issues.push({level:'caution',text:dup+' posibles movimientos duplicados',detail:'Coinciden fecha, concepto, tipo y monto. Revisa antes de borrar.'});
 const f=v8FundStats();if(f.used>f.total)issues.push({level:'urgent',text:'Fondo comprometido por encima del capital',detail:`Pagado ${fmoney(f.used)} frente a ${fmoney(f.total)} asignado.`});
 if(f.reserved+f.used>f.total)issues.push({level:'urgent',text:'Fondo sin saldo suficiente para reservas',detail:'Revisa destinos reservados o el monto efectivamente recibido.'});
 if(S.v8.fund.mode==='active'&&!S.v8.fund.loanOfferId)issues.push({level:'caution',text:'Fondo activo sin oferta bancaria vinculada',detail:'No es posible proyectar sus cuotas correctamente.'});
 if(S.v4?.imports?.some(x=>x.account==='CMR'))issues.push({level:'caution',text:'Cartolas CMR importadas: comprobar desglose',detail:'El importador histórico puede tratar una cuota del estado de cuenta como compra independiente.'});
 const extra=S.cardPurchases.filter(x=>x.source==='provisión recurrente'&&!x.included);
 if(extra.length)issues.push({level:'caution',text:'Suscripciones CMR sin conciliar',detail:`${extra.length} cargos estimados podrían estar incluidos en vencimientos históricos.`});
 const base=S.entries.filter(e=>e.category==='CMR'&&e.kind==='expense');if(base.length&&S.cardPurchases.length)issues.push({level:'caution',text:'Cuotas base CMR y compras individuales simultáneas',detail:'Los totales base pueden contener cuotas que también aparecen como compra individual. Marca «incluida» solo tras contrastar la cartola.'});
 const anchor=String(S.anchorDate||'');if(!/^\d{4}-\d\d-\d\d$/.test(anchor))issues.push({level:'urgent',text:'Fecha de saldo inicial no válida',detail:'La proyección mensual puede empezar en un período equivocado.'});
 if(!issues.length)issues.push({level:'good',text:'Sin advertencias automáticas detectadas',detail:'Esto no garantiza cuadratura bancaria ni reemplaza la conciliación CMR.'});return issues;
}

function mn12GroceryImpact(month){let z=S.v12,rec=mn12GroceryRecord(month);if(!rec)return null;let total=mn12GroceryTotal(month);
 if(rec.mode==='replace'){
  let baseline=nums(month).food;

  let foodTotal=rec.items.filter(x=>!['Aseo','Higiene'].includes(x.category)).reduce((a,x)=>a+(Number(x.qty)||0)*(Number(x.price)||0),0);
  let nonFood=Math.max(0,total-foodTotal);

  return {personal:newCash-baseline,fund:0,meaning:`Sustituye la estimación de alimentación pagada con dinero personal (${fmoney(baseline)}). Considera ${fmoney(foodTotal)} en alimentos y ${fmoney(nonFood)} en aseo/higiene no cubiertos por beneficios. Supone que la canasta reemplaza TODA tu alimentación mensual, y que los beneficios de ${fmoney(benefits)} están disponibles; el aseo se trata como adicional y podría ya estar presupuestado en vivienda.`};
 }
 if(rec.payment==='fund')return {personal:0,fund:total,meaning:'Compra adicional financiada desde la caja del crédito; no reduce el saldo personal libre, pero consume capital financiado.'};
 if(rec.payment==='cmr')return {personal:0,fund:0,meaning:'Compra adicional con tarjeta CMR, su efecto va al ciclo de pago correspondiente.'};
 return {personal:total,fund:0,meaning:'Compra adicional en efectivo o débito, aparte del presupuesto de alimentación que ya existe.'};

function mn15Diff(before,after){let updates=[],targets=new Set();let add=(name,links)=>{updates.push(name);links.forEach(x=>targets.add(x));};
const diffCollection=(name,oldList,newList,links,fmt)=>{if(!Array.isArray(oldList)&&!links.includes(V.page))return;oldList=Array.isArray(oldList)?oldList:[];newList=Array.isArray(newList)?newList:[];let old=new Map(oldList.map(x=>[String(x.id),JSON.stringify(x)]));let now=new Map(newList.map(x=>[String(x.id),JSON.stringify(x)]));let n=newList.find(x=>!old.has(String(x.id)));let changed=newList.find(x=>old.has(String(x.id))&&old.get(String(x.id))!==JSON.stringify(x));let removed=oldList.find(x=>!now.has(String(x.id)));if(n)add('Nuevo: '+fmt(n),links);else if(changed)add('Actualizado: '+fmt(changed),links);else if(removed)add('Eliminado: '+fmt(removed),links);};
const eLinks=x=>x?.nature==='Extraordinario'||['Vacaciones','Moto','Navidad'].includes(x?.category)?['transactionsAll','budget','plans','dashboard','decision']:['transactionsAll','budget','dashboard','decision'];
let oldEntries=before.entries||[],newEntries=after.entries||[];
let n=newEntries.find(x=>!oldEntries.some(y=>y.id===x.id));let changed=newEntries.find(x=>oldEntries.some(y=>y.id===x.id&&JSON.stringify(y)!==JSON.stringify(x)));let removed=oldEntries.find(x=>!newEntries.some(y=>y.id===x.id));let entry=n||changed||removed;
if(entry)add((n?'Movimiento nuevo: ':changed?'Movimiento actualizado: ':'Movimiento eliminado: ')+(entry.concept||entry.category||'Sin concepto')+' · '+fmoney(Number(entry.amount)||0),eLinks(entry));
diffCollection('CMR',before.cardPurchases,after.cardPurchases,['cmr','products','budget','dashboard','decision'],x=>(x.concept||'Compra')+' · '+fmoney(x.amount||0));
diffCollection('Wishlist',before.v8?.wishlist,after.v8?.wishlist,['wishlist','decision'],x=>x.name||'Artículo');
diffCollection('Ahorro',before.v14?.savings?.ledger,after.v14?.savings?.ledger,['savings','products','dashboard','budget'],x=>(x.direction==='deposit'?'Depósito':'Retiro')+' '+fmoney(x.amount||0));
for(let key of ['Amipass','JUNAEB'])diffCollection(key,before.v13?.benefits?.[key]?.ledger,after.v13?.benefits?.[key]?.ledger,['grocery','products','budget'],x=>key+' · '+fmoney(x.amount||0));
diffCollection('Supermercado',before.v13?.shopping,after.v13?.shopping,['grocery','budget','dashboard','decision','products','transactionsAll'],x=>(x.name||x.concept||'Compra'));
if(before.v14?.savings&&JSON.stringify(before.v14?.savings?.opening)!==JSON.stringify(after.v14?.savings?.opening))add('Saldo inicial de ahorro actualizado',['savings','products']);
if(before.v9?.budgets&&JSON.stringify(before.v9?.budgets||[])!==JSON.stringify(after.v9?.budgets||[]))add('Presupuesto actualizado',['budget','dashboard','decision']);
if(before.v10?.selected&&JSON.stringify(before.v10?.selected||[])!==JSON.stringify(after.v10?.selected||[]))add('Decisiones de simulación modificadas',['decision','dashboard']);
if(before.v12?.services&&JSON.stringify(before.v12?.services||[])!==JSON.stringify(after.v12?.services||[]))add('Oferta o servicio del hogar actualizado',['services','decision']);
if(before.v13?.serviceLink&&JSON.stringify(before.v13?.serviceLink||{})!==JSON.stringify(after.v13?.serviceLink||{}))add('Vinculación de servicio con presupuesto actualizada',['services','budget','decision']);
if(before.v12?.groceries&&JSON.stringify(before.v12?.groceries||[])!==JSON.stringify(after.v12?.groceries||[]))add('Lista de supermercado actualizada',['grocery','budget','decision']);
if(before.v13&&JSON.stringify(before.v13?.budgetAseo||0)!==JSON.stringify(after.v13?.budgetAseo||0))add('Presupuesto de aseo actualizado',['grocery','budget','dashboard']);
return {updates,targets:[...targets]};}

const MN18={budgetMonth:null,group:null,category:null,groceryGroup:null,groceryProduct:null,summaryMode:'planned',alertOpen:null};

function mn18Prefs(){try{localStorage.setItem(MN18_PREF,JSON.stringify({summaryMode:MN18.summaryMode}))}catch(_){}}
const mn18Money=v=>fmoney(Math.round(Number(v)||0));
function mn18Pct(n,total){return total>0?Math.round(1000*n/total)/10:0}
function mn18PctText(n,total){return mn18Pct(n,total).toLocaleString('es-CL',{maximumFractionDigits:1})+' %'}
function mn18Bar(amount,total,small=false){let p=mn18Pct(amount,total);return `<div class="mn18-track ${small?'small':''}"><div class="mn18-fill ${p>100?'over':''}" style="width:${Math.max(0,Math.min(100,p))}%"></div></div>`}
function mn18Actual(e){return e.status==='pagado'?(Number(e.actualAmount!==undefined&&e.actualAmount!==''?e.actualAmount:e.amount)||0):0}
function mn18BudgetRows(month){return expenseRows(month).map(e=>({...e,amount:Number(e.amount)||0,actual:mn18Actual(e),natureLabel:defaultNature(e),subcategoryLabel:defaultSub(e),plannedOnly:e.status!=='pagado'}));}

function mn18BudgetCard(month){let d=mn18BudgetData(month),mode=MN18.summaryMode,den=mode==='paid'?d.actual:d.all;let card=`<div class="mn18-card mn18-budget-card"><div class="mn18-heading"><div><h2>Radiografía de ${esc(labMonth(month))}</h2><p>Abre un grupo → categoría → movimiento para entender cada importe.</p></div><button data-mn18="help" data-guide="budget" type="button" class="btn small">Ayuda</button></div><div class="mn18-toggle"><button data-mn18="mode" data-mode="planned" class="${mode==='planned'?'selected':''}">Previsto</button><button data-mn18="mode" data-mode="paid" class="${mode==='paid'?'selected':''}">Pagado</button></div><div class="mn18-pair"><div><small>Gastos previstos</small><strong>${mn18Money(d.all)}</strong></div><div><small>Pagos registrados</small><strong>${mn18Money(d.actual)}</strong></div></div><div class="mn18-hint">${mode==='planned'?'Porcentaje del gasto previsto total. No es dinero ya pagado.':'Porcentaje de pagos confirmados registrados. Los compromisos pendientes no aparecen como pagados.'}</div><div class="mn18-tree">`;
 for(let g of d.groups){let amount=mode==='paid'?g.actual:g.amount,active=MN18.group===g.name,p=mn18PctText(amount,den);card+=`<div class="mn18-branch"><button type="button" class="mn18-head" data-mn18="group" data-name="${esc(g.name)}"><span>${active?'▾':'▸'} <b>${esc(g.name)}</b></span><span><b>${mn18Money(amount)}</b><small>${p} del total</small></span></button>${mn18Bar(amount,den)}${active?`<div class="mn18-children">${mn18Categories(g.rows,g.name,mode,amount)}</div>`:''}</div>`;}
 return card+`</div><p class="mn18-foot">Por ejemplo: una categoría de $100.000 dentro de un grupo de $320.000 representa el 31,3 % de ese grupo. El porcentaje del grupo respecto del total se muestra por separado.</p></div>`}
function mn18Categories(rows,group,mode,groupAmount){let cats=[...new Set(rows.map(e=>e.category))].sort();return cats.map(cat=>{let es=rows.filter(e=>e.category===cat),amount=es.reduce((s,e)=>s+(mode==='paid'?e.actual:e.amount),0),open=MN18.category===group+'|'+cat;return `<div class="mn18-child"><button class="mn18-head mn18-subhead" type="button" data-mn18="category" data-group="${esc(group)}" data-name="${esc(cat)}"><span>${open?'▾':'▸'} ${esc(cat)}</span><span><b>${mn18Money(amount)}</b><small>${mn18PctText(amount,groupAmount)} del grupo</small></span></button>${mn18Bar(amount,groupAmount,true)}${open?`<div class="mn18-leaves">${es.map(e=>{let val=mode==='paid'?e.actual:e.amount;return `<div class="mn18-leaf"><span><b>${esc(e.concept)}</b><small>${esc(e.subcategoryLabel)} · ${esc(e.status||'previsto')} · ${esc(e.date||'')}</small></span><span><b>${mn18Money(val)}</b><small>${mn18PctText(val,amount)} de ${esc(cat)}</small></span></div>`}).join('')}</div>`:''}</div>`}).join('')||'<p class="mn18-empty">Sin gastos de este grupo en el mes.</p>'}
function mn18GlobalLimits(){let cats=[...new Set([...S.categories,...Object.keys(MN17_LIMITS)])].filter(c=>c!=='Ingreso').sort((a,b)=>a.localeCompare(b,'es'));let base=cats.reduce((n,c)=>n+(Number(MN17_LIMITS[c]?.default)||0),0);let defined=cats.filter(c=>MN17_LIMITS[c]?.default!==undefined).length;return `<div class="v14-panel mn18-global"><div class="mn18-heading"><div><h2>Mis límites habituales</h2><p>Configúralos una sola vez. Se aplican a todos los meses salvo excepciones.</p></div><span class="mn18-pill">${defined} definidos</span></div><div class="mn18-pair"><div><small>Total de topes habituales</small><strong>${mn18Money(base)}</strong></div><div><small>No generan gastos</small><strong>Solo control</strong></div></div><div class="mn18-global-grid">${cats.map(c=>`<label class="mn18-limit-row"><span>${esc(c)}</span><input type="number" inputmode="numeric" min="0" step="1" data-mn18-limit="${esc(c)}" placeholder="Sin límite" value="${MN17_LIMITS[c]?.default===undefined?'':Number(MN17_LIMITS[c].default)}"></label>`).join('')}</div><div class="mn18-actions"><button type="button" class="btn primary" data-mn18="saveLimits">Guardar todos los límites</button><span>El campo vacío quita el límite habitual. Un límite 0 indica que no destinas presupuesto a esa categoría.</span></div></div>`}

function mn20LegacyXls(arraybuffer){

 const fat=[];for(const id of fatIDs){const s=sectors(id),v=new DataView(s.buffer,s.byteOffset,s.length);for(let j=0;j<size/4;j++)fat.push(u32(v,j*4))}
 const chain=(first,map)=>{const a=[],seen=new Set();let p=first;while(p<0xFFFFFFFA){if(p>=map.length||seen.has(p)||a.length>100000)throw Error('Cadena XLS dañada');seen.add(p);a.push(p);p=map[p]}return a};

 const stream=(start,len)=>join(chain(start,fat).map(sectors),len);
 const directory=stream(u32(dv,48),size*1000),dir=[];
 for(let pos=0;pos+128<=directory.length;pos+=128){const row=directory.subarray(pos,pos+128),v=new DataView(row.buffer,row.byteOffset,row.length),nameLen=u16(v,64);if(nameLen<2||nameLen>64)continue;const name=new TextDecoder('utf-16le').decode(row.subarray(0,nameLen-2));dir.push({name,type:row[66],first:u32(v,116),bytes:u32(v,120)})}

   for(let i=0;i<number;i++){if(p+3>q.length)throw Error('Este XLS usa cadenas divididas entre registros; exporta una cartola más corta.');const n=u16(view,p),flags=q[p+2];p+=3;let rich=0,ext=0;if(flags&8){rich=u16(view,p);p+=2}if(flags&4){ext=u32(view,p);p+=4}let len=n*((flags&1)?2:1);if(p+len>q.length)throw Error('Texto XLS dividido entre registros; usa una cartola más corta.');let text=(flags&1)?new TextDecoder('utf-16le').decode(q.subarray(p,p+len)):decoder.decode(q.subarray(p,p+len));p+=len+rich*4+ext;strings.push(text)}break;

async function mn24IsHeif(file){
 const mime=String(file.type||'').toLowerCase();
 if(/heic|heif/.test(mime)||/\.(heic|heif)$/i.test(file.name||''))return true;
 try{
  const b=new Uint8Array(await file.slice(0,36).arrayBuffer());
  const tag=String.fromCharCode(...b.slice(4,12));
  return /ftyp(heic|heix|hevc|hevx|mif1|msf1)/i.test(tag);
 }catch(_){return false;}
}
async function mn24HeifToBlob(file){
 MN21.receiptStatus='Convirtiendo HEIC mediante un lector actualizado…';
 let errors=[];
 try {
  await mn21LoadScript('https://cdn.jsdelivr.net/npm/heic-to@1.6.7/dist/iife/heic-to.js','HeicTo');
  const blob=await window.HeicTo({blob:file,type:'image/jpeg',quality:0.94});
  if(blob&&blob.size>0)return blob;
  throw Error('Conversión sin resultado');
 } catch(e){errors.push('heic-to: '+String(e?.message||e));}
 try {
  await mn21LoadScript('https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js','heic2any');
  const r=await window.heic2any({blob:file,toType:'image/jpeg',quality:0.92});
  const blob=Array.isArray(r)?r[0]:r;
  if(blob&&blob.size>0)return blob;
  throw Error('Conversión sin resultado');
 }catch(e){errors.push('heic2any: '+String(e?.message||e));}
 throw Error('Los dos lectores HEIC no pudieron abrir esta foto. Puedes probar una captura de pantalla de la foto o exportarla como JPEG. '+errors.join(' | ').slice(0,280));
}
async function mn23ImageCanvas(file){
 // Some iPhones produce HEIC/HEIF that neither HTMLImageElement nor createImageBitmap can decode.
 // Convert to a standard image locally first. No receipt is uploaded to a server.
 const heif=await mn24IsHeif(file);
 let source=heif?await mn24HeifToBlob(file):file;
 let img=null,bitmap=null,url=null;
 try {
  try { bitmap=await createImageBitmap(source,{imageOrientation:'from-image'}); } catch(_) {}
  if(!bitmap){
   url=URL.createObjectURL(source);
   img=await new Promise((resolve,reject)=>{
    const node=new Image();
    node.onload=()=>resolve(node);
    node.onerror=()=>reject(new Error(heif?'La conversión terminó, pero el navegador no pudo abrir la imagen resultante.':'El navegador no pudo decodificar este archivo. Comprueba que sea una fotografía JPG, PNG, WEBP o HEIC válida.'));
    node.src=url;
   });
  }
  const iw=bitmap?.width||img?.naturalWidth,ih=bitmap?.height||img?.naturalHeight;
  if(!iw||!ih)throw new Error('La imagen no tiene dimensiones válidas.');
  const scale=Math.min(1,2600/Math.max(iw,ih));
  const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(iw*scale));canvas.height=Math.max(1,Math.round(ih*scale));
  const ctx=canvas.getContext('2d',{willReadFrequently:true});if(!ctx)throw new Error('El navegador no pudo preparar la imagen.');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(bitmap||img,0,0,canvas.width,canvas.height);
  return canvas;
 }finally{if(bitmap)bitmap.close();if(url)URL.revokeObjectURL(url);}
}
async function mn21ReceiptOCR(){
 const el=document.getElementById('mn21ReceiptFile'),file=MN21.selectedFile||el?.files?.[0];
 if(!file)return notify('Primero selecciona una boleta.');
 if(!confirm('La herramienta OCR se descargará de internet. La boleta se procesará localmente en este navegador. Revisa todo antes de agregar productos. ¿Continuar?'))return;
 MN21.receiptWorking=true;MN21.receiptStatus='Preparando imagen para lectura…';render();
 let worker=null;
 try{
  let ocrInput;
  if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){
   await mn21LoadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','pdfjsLib');
   window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
   const bytes=await file.arrayBuffer(),doc=await window.pdfjsLib.getDocument({data:bytes}).promise;
   const page=await doc.getPage(1),vp=page.getViewport({scale:2});
   const canvas=document.createElement('canvas');canvas.width=vp.width;canvas.height=vp.height;
   await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
   ocrInput=canvas;
  }else{
   ocrInput=await mn23ImageCanvas(file);
  }
  // Built-in detection is preferred, but always pass the decoded canvas to the fallback.
  if('TextDetector' in window){
   try{const blocks=await new window.TextDetector().detect(ocrInput);if(blocks.length){
    MN21.receiptText=blocks.map(x=>x.rawValue).join('\n');
    MN21.receiptRows=mn21ParseReceipt(MN21.receiptText);
    MN21.receiptStatus=mn28ReceiptStatus(MN21.receiptText,MN21.receiptRows,'Reconocimiento');
    return;
   }}catch(e){}
  }
  MN21.receiptStatus='Leyendo la imagen con OCR…';
  await mn21LoadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js','Tesseract');
  worker=await window.Tesseract.createWorker('spa');
  // A canvas data URL avoids the 'Error attempting to read image' error on local File objects.
  const result=await worker.recognize(ocrInput.toDataURL('image/png'));
  MN21.receiptText=result?.data?.text||'';
  MN21.receiptRows=mn21ParseReceipt(MN21.receiptText);
  MN21.receiptStatus=mn28ReceiptStatus(MN21.receiptText,MN21.receiptRows,'OCR');
 }catch(error){
  const message=String(error?.message||error);
  MN21.receiptStatus=(/script|cdn|network|fetch|worker|timeout/i.test(message)?'No se pudo cargar la dependencia OCR. ':'No se pudo abrir o decodificar la imagen. ')+message+' Puedes pegar el texto o añadir productos manualmente.';
 }finally{
  try{await worker?.terminate()}catch(e){}
  MN21.receiptWorking=false;render();
 }
}

 transactionsAll:{title:'Movimientos',intro:'Registrar no es conciliar. La conciliación empieza después, al comparar los registros con la cartola y el saldo del banco.',steps:['Abre Movimientos y selecciona el mes correcto: comprueba el año y el mes del encabezado.','Para una operación nueva utiliza Registrar movimiento. Elige el tipo correcto: Ingreso, Gasto, compra CMR o Transferencia.','Selecciona fecha, concepto, categoría y monto. Un gasto previsto no debería marcarse como pagado hasta que realmente ocurra.','Si compraste con CMR, usa el tipo CMR: no crees además un gasto de débito por la misma compra.','Guarda y verifica que el registro aparezca dentro del mes seleccionado. Si no lo ves, revisa el filtro de mes y los filtros de búsqueda.','Para corregir un error, edita el mismo registro. No agregues otro para reemplazarlo.','Si viene de tu cartola, utiliza Importar cartola para cotejarlo. Antes de confirmar, busca coincidencias con registros manuales.','Cuando termines de clasificar y comparar la cartola, entra en Cierre y conciliación para validar el saldo bancario del mes.'],example:'Ejemplo: pagaste $12.000 en transporte con débito. Registra un gasto de $12.000, con fecha real, categoría Transporte y estado Pagado. Al importar la cartola, evita confirmar otra fila que represente el mismo pago.',check:['El movimiento aparece una vez en el mes correcto.','La categoría y el método de pago coinciden con la realidad.','No se creó una segunda operación al importar la cartola.'],warning:'El pago de la CMR no es otra compra. Las transferencias a ahorro tampoco son gastos.'},

 reconcile:{title:'Conciliar la cuenta paso a paso',intro:'Conciliar es comparar el saldo que calcula Mi Norte con el saldo real del banco al cierre de un mes. El cierre ajusta la proyección, pero no crea ni arregla automáticamente movimientos faltantes.',steps:['Primero descarga la cartola bancaria del período y prepara el saldo real al último día del mes.','Ve a Movimientos → Importar cartolas y revisa los cargos y abonos que no estén registrados.','Clasifica los movimientos y verifica los registros duplicados antes de aceptarlos.','En Movimientos revisa el mes y distingue Gastos previstos de Gastos pagados.','En Movimientos selecciona «Ver conciliación completa» y, dentro de esa vista, abre «Cierre y conciliación» si el menú está contraído.','En Mes que deseas revisar selecciona exactamente el mes de la cartola.','Compara «Saldo proyectado» con el saldo del banco. No uses el saldo de hoy para cerrar un mes anterior.','En «Saldo real bancario al cierre» ingresa el monto que figura en el banco al último día del mes.','Comprueba la fecha de verificación. En Observación anota de dónde salió el saldo y si quedan movimientos sin identificar.','Pulsa «Guardar cierre y recalcular posteriores». Esto fija un punto de control y actualiza la proyección de meses siguientes.','En «Desviación del mes», compara Proyección previa, Saldo informado y Corrección por conciliación. Si es grande, vuelve a Movimientos y busca pagos faltantes, duplicados o fechas incorrectas.','Si corriges registros del mes, vuelve a Cierre y conciliación y revisa de nuevo la diferencia antes de darlo por cerrado.'],example:'Mi Norte proyecta $420.000 al 30 de noviembre; el banco muestra $398.000. La diferencia es −$22.000. El cierre la refleja, pero primero debes investigar si hubo un cargo bancario no registrado. No agregues un gasto ficticio de $22.000 solo para forzar el resultado.',check:['Mes y fecha del saldo del banco son iguales a los del cierre.','Ya revisaste los cargos, abonos y posibles duplicados.','La diferencia está explicada o documentada como pendiente.','Los meses posteriores usan el nuevo punto de control.'],warning:'«Guardar cierre» no es una conciliación automática operación por operación. Si faltan movimientos, la diferencia seguirá siendo un dato por investigar.'},
 grocery:{title:'Supermercado y boletas',intro:'Distingue una lista de compra estimada de una compra confirmada. La boleta se usa para preparar una lista, no para pagar automáticamente.',steps:['Abre Presupuesto → Supermercado y selecciona el mes de la compra.','Revisa si la lista corresponde a una compra adicional o a una sustitución de presupuesto; esto afecta la simulación.','Puedes agregar productos manualmente con Producto, Tipo, Cantidad y Precio.','Para usar una boleta, pulsa Seleccionar foto, imagen o PDF escaneado.','Pulsa Intentar reconocer texto. Si falla, copia el texto de la boleta en el recuadro y selecciona Analizar texto pegado.','Revisa cada candidato: el OCR puede confundir números, cantidades, descuentos, nombres y total. Corrige precio unitario y cantidad.','Marca solo los productos que deseas agregar. Pulsa «Agregar seleccionados a canasta estimada».','Verifica los subtotales de Alimentación y Aseo e higiene; abre sus barras para ver productos y porcentajes.','Antes de confirmar una compra, verifica los saldos reales de Amipass y JUNAEB y qué artículos pueden pagarse con cada beneficio.','Al confirmar se crea una compra única y se vinculan los consumos de Amipass/JUNAEB y el resto de débito o CMR. Abre Movimientos o CMR para comprobar el registro vinculado: no vuelvas a ingresarlo. Cuando aparezca en la cartola, vincúlalo sin crear un segundo gasto.'],example:'Compraste leche $1.200 y detergente $3.990. El primer artículo corresponde a Alimentación y el segundo a Aseo. Si el OCR reconoce $39.900 para el detergente, corrígelo antes de guardar.',check:['No se importaron líneas Total, IVA, vuelto ni descuentos como productos.','Cada producto tiene cantidad y precio correctos.','La compra estimada no cambió tus saldos reales.','Los consumos de Amipass/JUNAEB coinciden con los pagos confirmados.'],warning:'El OCR necesita revisión manual obligatoria. La conciliación bancaria posterior puede requerir revisar coincidencias; nunca confirmes dos veces la misma operación.'},
 monitor:{title:'Monitoreo y análisis',intro:'Monitoreo resume datos, no los modifica. Los gráficos previstos no equivalen a dinero ya gastado.',steps:['Abre Monitoreo.','Selecciona el mes en el selector superior.','Lee los KPI y distingue ingresos previstos, salidas previstas, pagos confirmados y excedente proyectado.','En Explorar resultados selecciona Panorama o Categorías.','Elige Pagado o Previsto antes de interpretar una barra.','Pulsa una categoría para conocer su proporción y los movimientos que la componen.','En Tendencias elige 3, 6 o 12 meses. Pulsa un mes para enfocar el período.','En Supermercado despliega las compras confirmadas y consulta Alimentación, Aseo y medios de pago.','Abre «Otros gráficos y resúmenes» cuando necesites una vista adicional, sin recargar el panel principal.','Si una cifra no coincide, vuelve a su origen; Monitoreo no corrige datos por sí solo.'],example:'Si Ocio muestra 110 % de su límite, significa que el gasto considerado supera el techo, pero verifica si el gráfico está mostrando solo pagos o también partidas previstas.',check:['El mes y el período son los que deseas analizar.','La leyenda del gráfico corresponde a Pagado o Previsto.','El importe coincide con el detalle que muestra la misma vista.'],warning:'Los KPI de gasto previsto dependen de presupuestos, no de un saldo bancario verificado.'},
 categories:{title:'Categorías y límites',intro:'Los límites son techos de control; no generan movimientos, pagos ni ahorros por sí mismos.',steps:['Abre Presupuesto → Categorías.','Selecciona un mes para revisar las barras de utilización.','En la administración de límites abre los Límites habituales.','Establece un monto para cada categoría que quieras controlar de manera global.','Guarda una vez: el límite habitual se utiliza en todos los meses que no tengan una excepción.','Si un mes será distinto, edita esa categoría solo para ese mes y guarda la excepción.','Abre la barra horizontal de una categoría para consultar los pagos o montos previstos y su porcentaje de utilización.','Usa el promedio mensual para comparar tendencias sin tomar un mes sin datos como gasto cero.','Si una categoría excede su límite, consulta los movimientos antes de modificar el techo.'],example:'Ocio tiene límite habitual de $50.000. En diciembre decides una excepción de $80.000; en enero se vuelve a aplicar el habitual sin editarlo otra vez.',check:['El límite habitual permanece en otros meses.','La excepción solo afecta el mes esperado.','El límite no alteró el saldo bancario.'],warning:'Límite es distinto de gasto previsto: establecer $50.000 como máximo no significa que efectivamente hayas gastado $50.000.'}

function v26ValidDate(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(value)))return false;const [y,m,d]=String(value).split('-').map(Number);const z=new Date(Date.UTC(y,m-1,d));return z.getUTCFullYear()===y&&z.getUTCMonth()===m-1&&z.getUTCDate()===d;}

function v26HealthyLedger(opening,ledger,benefit=false){const dates=[...new Set(ledger.map(x=>x.date))].sort();return dates.every(date=>v26ValidDate(date)&&v26DateBalance(opening,ledger,date,benefit)>=-0.001);}

// V28: no unir ingresos ni compras únicamente por importe y mes.
function v28VerifiedIncome(entry,row){
 const normal=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
 const a=normal(entry.concept), b=normal(row.description);
 if(!a||!b||entry.kind!=='income'||Number(entry.amount)!==Math.abs(Number(row.amount)))return false;
 const payroll=/\b(sueldo|remuneracion|nomina|haberes|liquidacion de sueldo)\b/;
 if(payroll.test(a)!==payroll.test(b))return false;
 if(payroll.test(a)&&payroll.test(b))return true;
 return a===b && entry.date===row.date;
}
function v28IsGroceryDescriptor(text){return /supermercad|jumbo|lider|lider|unimarc|tottus|santa isabel|almacen|abasto|mayorista|feria/i.test(String(text||''));}
function v28VerifiedGrocery(shop,row){const normalize=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/ +/g,' ').trim();const merchant=normalize(shop.name),bank=normalize(row.description);if(!merchant||['supermercado','compra','compra supermercado','sin especificar'].includes(merchant))return false;return merchant.length>=4&&bank.includes(merchant)&&shop.date===row.date&&Number(shop.rest)===Math.abs(Number(row.amount));}

function v27Money(x){return typeof x==='number'&&Number.isFinite(x)}
function v27Month(x){return typeof x==='string'&&/^\d{4}-(0[1-9]|1[0-2])$/.test(x)}
function v27ValidLedger(obj,kind){
 if(!v27Obj(obj)||!v27Money(Number(obj.opening))||Number(obj.opening)<0||!Array.isArray(obj.ledger))throw Error('Caja de '+kind+' inválida');
 const ids=new Set();
 for(const x of obj.ledger){if(!v27Obj(x)||typeof x.id!=='string'||!x.id||ids.has(x.id)||!v26ValidDate(x.date)||!v27Money(x.amount)||x.amount<=0)throw Error('Operación inválida en '+kind);ids.add(x.id);
 if(kind==='ahorro'?!['deposit','withdraw'].includes(x.direction):!['recarga','consumo'].includes(x.type))throw Error('Tipo inválido en '+kind);}
 if(!v26HealthyLedger(obj.opening,obj.ledger,kind!=='ahorro'))throw Error('La caja '+kind+' presenta saldo negativo en alguna fecha');
}
